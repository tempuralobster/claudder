<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Claudder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claudder">
<meta name="theme-color" content="#1da1f2">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  /* iOSのホーム画面アプリでは、ステータスバーの裏にbodyの背景色が透ける。
     白いままだと上部が白っぽくぼやけて見えるため、ヘッダーと同じ青を敷いておく。 */
  body { margin: 0; padding: 0; background: #1da1f2; }
  /* ステータスバー領域を不透明な青で塗りつぶす保険 */
  .tl-statusbar-fill {
    position: fixed; top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top);
    background: #1da1f2;
    z-index: 20;
    pointer-events: none;
  }
  .tl-root {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f7f9fa;
    color: #14171a;
    min-height: 100vh;
  }
  .tl-header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #1da1f2;
    border-bottom: 1px solid #1487cf;
    padding: 14px 18px;
    padding-top: calc(14px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tl-brand { display: flex; align-items: center; gap: 10px; }
  .tl-logo { width: 34px; height: 34px; min-width: 34px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.55); }
  .tl-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tl-title { font-size: 19px; font-weight: 800; font-style: italic; letter-spacing: 0.3px; color: #ffffff; }
  .tl-sub { font-size: 11.5px; color: rgba(255,255,255,0.85); margin-top: 2px; font-weight: 400; }
  .tl-filter {
    padding: 7px 14px; border: 1px solid rgba(255,255,255,0.6); border-radius: 999px;
    font-size: 13px; background: rgba(255,255,255,0.95); color: #14171a; min-width: 160px; outline: none;
  }
  .tl-filter::placeholder { color: #8899a6; }
  .tl-filter:focus { border-color: #fff; background: #fff; }
  .tl-refresh {
    width: 44px; height: 44px; min-width: 44px; border-radius: 50%; border: none;
    background: #ffffff; color: #1da1f2; font-size: 19px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; transition: transform 0.15s ease, background 0.15s ease; padding: 0;
  }
  .tl-refresh img { width: 26px; height: 26px; object-fit: contain; display: block; }
  .tl-refresh:hover { background: #eaf6fd; }
  .tl-refresh:active { transform: scale(0.92); }
  .tl-refresh.tl-spin { animation: tl-spin 0.8s linear; }
  @keyframes tl-spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  .tl-compact {
    padding: 8px 16px; border-bottom: 1px solid #eaedf0; font-size: 12.5px; color: #657786;
    display: flex; align-items: center; gap: 6px;
  }
  .tl-compact a { color: #1da1f2; text-decoration: none; }
  .tl-compact a:hover { text-decoration: underline; }
  .tl-compose {
    display: flex; gap: 10px; padding: 12px 16px; background: #fff; max-width: 560px; margin: 0 auto;
    border-left: 1px solid #eaedf0; border-right: 1px solid #eaedf0; border-bottom: 2px solid #eaedf0;
  }
  .tl-compose-avatar {
    width: 44px; height: 44px; min-width: 44px; border-radius: 50%; background: #ff7043;
    display: flex; align-items: center; justify-content: center; font-size: 21px; color: #fff; overflow: hidden;
  }
  .tl-compose-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tl-compose-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .tl-compose-input {
    width: 100%; border: 1px solid #e1e8ed; border-radius: 10px; padding: 8px 10px; font-size: 14px;
    font-family: inherit; resize: vertical; min-height: 44px; outline: none; box-sizing: border-box; color: #14171a;
  }
  .tl-compose-input:focus { border-color: #1da1f2; }
  .tl-compose-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .tl-compose-status { font-size: 12px; color: #657786; margin-right: auto; }
  .tl-compose-btn {
    background: #1da1f2; color: #fff; border: none; border-radius: 999px; padding: 7px 18px;
    font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .tl-compose-btn:hover { background: #1a91da; }
  .tl-compose-btn:disabled { opacity: 0.6; cursor: default; }
  .tl-feed { max-width: 560px; margin: 0 auto; background: #fff; border-left: 1px solid #eaedf0; border-right: 1px solid #eaedf0; min-height: 400px; }
  .tl-post { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #eaedf0; animation: tl-in 0.25s ease; }
  @keyframes tl-in { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
  .tl-post:hover { background: #fafafa; }
  .tl-avatar {
    width: 44px; height: 44px; min-width: 44px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 21px; color: #fff; overflow: hidden; position: relative;
  }
  .tl-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tl-body { flex: 1; min-width: 0; }
  .tl-line1 { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
  .tl-name { font-weight: 700; font-size: 14.5px; color: #14171a; }
  .tl-badge { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; color: #fff; }
  .tl-handle { font-size: 13px; color: #657786; }
  .tl-dot { color: #657786; font-size: 12px; }
  .tl-time { font-size: 13px; color: #657786; }
  .tl-origin { font-size: 10px; color: #657786; background: #f0f3f4; border-radius: 6px; padding: 1px 6px; margin-left: auto; white-space: nowrap; }
  .tl-text { font-size: 14.5px; line-height: 1.45; color: #14171a; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .tl-footer-link { display: inline-block; margin-top: 6px; font-size: 12px; color: #1da1f2; text-decoration: none; }
  .tl-footer-link:hover { text-decoration: underline; }
  .tl-engage { display: flex; align-items: center; gap: 26px; margin-top: 8px; }
  .tl-engage-btn {
    display: flex; align-items: center; gap: 5px; background: none; border: none; padding: 4px 6px;
    margin: -4px -6px; border-radius: 8px; font-size: 12.5px; color: #657786; cursor: default;
  }
  .tl-engage-btn.tl-clickable { cursor: pointer; }
  .tl-engage-btn.tl-clickable:hover { background: #ffecf1; color: #e0245e; }
  .tl-engage-icon { font-size: 14px; }
  .tl-engage-btn.tl-liked { color: #e0245e; }
  .tl-reply { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; padding-left: 18px; border-top: 1px dashed #e1e8ed; }
  .tl-reply-avatar {
    width: 30px; height: 30px; min-width: 30px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 15px; color: #fff; overflow: hidden;
  }
  .tl-reply-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tl-reply-body { flex: 1; min-width: 0; }
  .tl-reply-line1 { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
  .tl-reply-name { font-weight: 700; font-size: 12.5px; color: #14171a; }
  .tl-reply-time { font-size: 11px; color: #657786; }
  .tl-reply-btn { background: none; border: none; padding: 4px 6px; margin: -4px -6px; border-radius: 8px; font-size: 12.5px; color: #657786; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .tl-reply-btn:hover { background: #eaf6fd; color: #1da1f2; }
  .tl-replybox { margin-top: 10px; display: flex; gap: 8px; }
  .tl-replybox-avatar { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; background: #ff7043; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; overflow: hidden; }
  .tl-replybox-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tl-replybox-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .tl-replybox-input { width: 100%; border: 1px solid #e1e8ed; border-radius: 10px; padding: 7px 10px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 38px; outline: none; box-sizing: border-box; color: #14171a; }
  .tl-replybox-input:focus { border-color: #1da1f2; }
  .tl-replybox-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .tl-replybox-status { font-size: 11.5px; color: #657786; margin-right: auto; }
  .tl-replybox-send { background: #1da1f2; color: #fff; border: none; border-radius: 999px; padding: 5px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .tl-replybox-send:hover { background: #1a91da; }
  .tl-replybox-send:disabled { opacity: 0.6; cursor: default; }
  .tl-replybox-cancel { background: none; border: none; color: #657786; font-size: 12px; cursor: pointer; }
  .tl-reply-text { font-size: 13px; line-height: 1.4; color: #14171a; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .tl-empty, .tl-loading { text-align: center; color: #657786; font-size: 13.5px; padding: 40px 20px; }
  .tl-spinner {
    width: 30px; height: 30px; border: 3px solid #e1e8ed; border-top-color: #1da1f2; border-radius: 50%;
    margin: 0 auto 12px; animation: tl-spin-loop 0.8s linear infinite;
  }
  @keyframes tl-spin-loop { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  .tl-error { margin: 12px 16px; font-size: 12.5px; color: #b34747; background: #fbe9e9; border-radius: 8px; padding: 8px 10px; }
  .tl-auth {
    max-width: 400px; margin: 60px auto; padding: 32px 24px; background: #fff; border-radius: 16px;
    text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .tl-auth img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 12px; }
  .tl-auth h1 { font-size: 20px; font-style: italic; font-weight: 800; margin: 0 0 6px; color: #1da1f2; }
  .tl-auth p { font-size: 13px; color: #657786; margin: 0 0 20px; line-height: 1.6; }
  .tl-auth-btn {
    background: #1da1f2; color: #fff; border: none; border-radius: 999px; padding: 10px 24px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .tl-auth-btn:hover { background: #1a91da; }
  .tl-auth-status { margin-top: 14px; font-size: 12px; color: #b34747; min-height: 16px; }
  .tl-puzzle { margin: 18px auto 4px; max-width: 280px; }
  .tl-puzzle-header { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: #657786; margin-bottom: 8px; padding: 0 2px; }
  .tl-puzzle-title { font-weight: 700; color: #14171a; }
  .tl-puzzle-grid { position: relative; background: #eef3f5; border-radius: 12px; padding: 6px; margin: 0 auto; touch-action: none; }
  .tl-puzzle-grid.tl-puzzle-shake { animation: tl-puzzle-shake 0.26s ease-in-out; }
  @keyframes tl-puzzle-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  .tl-puzzle-cell {
    position: absolute; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; background: #ffffff; border-radius: 8px; cursor: pointer; user-select: none; touch-action: none;
    transition: left 0.22s ease, top 0.28s ease, opacity 0.25s ease, transform 0.15s ease, background 0.15s ease;
  }
  .tl-puzzle-cell:hover { background: #f5f8fa; }
  .tl-puzzle-cell.tl-puzzle-selected { background: #eaf6fd; box-shadow: inset 0 0 0 2px #1da1f2; transform: scale(0.92); }
  .tl-puzzle-cell.tl-puzzle-hint-pulse { animation: tl-puzzle-hint-pulse 1s ease-in-out infinite; }
  @keyframes tl-puzzle-hint-pulse { 0%, 100% { background: #ffffff; } 50% { background: #cdeefb; } }
  .tl-puzzle-cell.tl-puzzle-pop { animation: tl-puzzle-pop 0.26s ease-in forwards; pointer-events: none; }
  @keyframes tl-puzzle-pop {
    0% { transform: scale(1) rotate(0deg); opacity: 1; }
    40% { transform: scale(1.35) rotate(12deg); opacity: 1; }
    100% { transform: scale(0) rotate(25deg); opacity: 0; }
  }
  .tl-puzzle-hint { text-align: center; font-size: 11px; color: #8899a6; margin-top: 8px; }
  .tl-puzzle-badge { position: absolute; right: -3px; bottom: -3px; font-size: 12px; line-height: 1; filter: drop-shadow(0 0 1px rgba(0,0,0,0.5)); pointer-events: none; }
  .tl-puzzle-cell.tl-puzzle-special-lineH, .tl-puzzle-cell.tl-puzzle-special-lineV { box-shadow: inset 0 0 0 2px #1da1f2; }
  .tl-puzzle-cell.tl-puzzle-special-wrapped { box-shadow: inset 0 0 0 2px #e0447e; }
  .tl-puzzle-cell.tl-puzzle-special-flyer { box-shadow: inset 0 0 0 2px #ffb400; }
  .tl-puzzle-cell.tl-puzzle-special-colorbomb { background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1); }
  .tl-puzzle-heli { position: absolute; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: left 0.26s ease, top 0.26s ease; pointer-events: none; z-index: 5; }
</style>
</head>

  // 【2026-08-12〜】Inboxは「1件1ファイル」方式になり、ファイル名の末尾に
  // 書き手の識別子（YYYY-MM-DD-HH-MM_環境_担当.md）が入るようになった。
  // 本文の書き方に依存せず確実に判定できるので、ファイル名を最優先で見る。
  const FILENAME_TAGS = {
    Standard_Daily:  'daily_normal',
    Standard_Beauty: 'beauty_normal',
    Standard_Work:   'work_normal',
    Desktop_Daily:   'daily_cowork',
    Desktop_Work:    'work_cowork',
    Cloud_Daily:     'daily_cloud',
    Cloud_Work:      'work_cloud',
    TEMPURA:         'tempura_self'
  };

  // ファイル名から書き手を判定する。判定できなければ null。
  function personaKeyFromTitle(title) {
    const m = String(title || '').match(/_([A-Za-z]+_[A-Za-z]+|TEMPURA)(?:-\d+)?\.md$/);
    if (!m) return null;
    return FILENAME_TAGS[m[1]] || null;
  }

  function detectPersona(title, content, origin) {
    // ① ファイル名で判定（新方式・これが本命）
    const byName = personaKeyFromTitle(title);
    if (byName) return PERSONAS[byName];

    // ② 旧方式のファイル向けフォールバック（本文から判定）
    const c = content || '';

    const HEADINGS = [
      { re: /（日常クーちゃん記録・クラウド版）/g,     p: 'daily_cloud' },
      { re: /（日常クーちゃん記録・デスクトップ版）/g, p: 'daily_cowork' },
      { re: /（仕事クーちゃん記録・クラウド版）/g,     p: 'work_cloud' },
      { re: /（仕事クーちゃん記録・デスクトップ版）/g, p: 'work_cowork' },
      { re: /（日常クーちゃん記録）/g,                 p: 'daily_cowork' },
      { re: /（仕事クーちゃん記録）/g,                 p: 'work_cowork' }
    ];

    function lastHeadingPersona(text) {
      let bestPos = -1, bestKey = null;
      for (const h of HEADINGS) {
        h.re.lastIndex = 0;
        let m, last = -1;
        while ((m = h.re.exec(text)) !== null) last = m.index;
        if (last > bestPos) { bestPos = last; bestKey = h.p; }
      }
      return bestKey ? PERSONAS[bestKey] : null;
    }

    if (/^Cowork-/.test(title)) {
      return lastHeadingPersona(c) || PERSONAS.daily_cowork;
    }

    const rec = c.match(/^記録者[:：]\s*(日常|美容|仕事)クーちゃん\s*[（(]?\s*(通常版|クラウド[^）)]*版|デスクトップ[^）)]*版|Cowork版)?/m);
    if (rec) {
      const who = rec[1];
      const env = rec[2] || '';
      const isCloud = /クラウド/.test(env);
      const isDesktop = /デスクトップ/.test(env);
      if (who === '美容') return PERSONAS.beauty_normal;
      if (who === '仕事') return isCloud ? PERSONAS.work_cloud : (isDesktop ? PERSONAS.work_cowork : PERSONAS.work_normal);
      return isCloud ? PERSONAS.daily_cloud : (isDesktop ? PERSONAS.daily_cowork : PERSONAS.daily_normal);
    }

    const byHeading = lastHeadingPersona(c);
    if (byHeading) return byHeading;

    if (/^\d{4}-\d{2}-\d{2}-\d{2}-\d{2}/.test(title)) return PERSONAS.daily_normal;
    return PERSONAS.unknown;
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function relTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = new Date();
    const diffSec = Math.floor((now - d) / 1000);
    if (diffSec < 60) return 'たった今';
    if (diffSec < 3600) return Math.floor(diffSec / 60) + '分前';
    if (diffSec < 86400) return Math.floor(diffSec / 3600) + '時間前';
    if (diffSec < 86400 * 7) return Math.floor(diffSec / 86400) + '日前';
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${mm}/${dd}`;
  }

  // AI要約は使わず、各クーちゃんが用意した「Claudder要約：」行だけを使う（なければ本文の頭を切り出すだけ）
  function fallbackSummary(content) {
    const cleaned = (content || '')
      .replace(/記録者[:：].*/g, '')
      .replace(/^#+\s*/gm, '')
      .replace(/[*_`>#-]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    return cleaned.slice(0, 70) + (cleaned.length > 70 ? '…' : '') + ' 📝';
  }

  function unescapeMd(s) {
    return (s || '')
      .replace(/  \n/g, '\n')
      .replace(/\\([#*_\[\]()\-+.!`>~])/g, '$1')
      .replace(/\[\[e:([0-9a-fA-F]+)\]\]/g, (m, hex) => {
        try { return String.fromCodePoint(parseInt(hex, 16)); } catch (e) { return ''; }
      });
  }

  function extractPreparedSummary(content) {
    // 同じファイルに複数回追記されるログ（Cowork-YYYY-MM-DD.mdなど）では、
    // 一番「最後」に書かれたClaudder要約行を使う（＝最新の更新内容を表示するため）
    const re = /^Claudder要約[:：]\s*(.+)$/gm;
    let m, last = null;
    while ((m = re.exec(content || '')) !== null) last = m;
    if (!last) return null;
    const text = unescapeMd(last[1]).trim();
    return text ? text : null;
  }

  function encodeEmojiForStorage(text) {
    return (text || '').replace(/[\u{10000}-\u{10FFFF}]/gu, ch => `[[e:${ch.codePointAt(0).toString(16)}]]`);
  }

  // 【2026-08-12〜】えびちゃんからクーちゃんへの返信は、既存ファイルを書き換えられない制約のため
  // 「返信専用の別ファイル」として保存する。ファイル名は YYYY-MM-DD-HH-MM_TEMPURA-reply.md、
  // 本文の「返信先：」行でどの投稿への返信かを示す。
  function parseReplyFile(title, content) {
    if (!/_TEMPURA-reply(?:-\d+)?\.md$/.test(String(title || ''))) return null;
    const c = unescapeMd(content || '');
    const m = c.match(/^返信先[:：]\s*(.+)$/m);
    if (!m) return null;
    const t = c.match(/^投稿日時[:：]\s*(.+)$/m);
    const body = c
      .replace(/^#.*$/m, '')
      .replace(/^記録者[:：].*$/m, '')
      .replace(/^返信先[:：].*$/m, '')
      .replace(/^投稿日時[:：].*$/m, '')
      .trim();
    return { target: m[1].trim(), time: t ? t[1].trim() : '', body: body };
  }

  function splitReply(content) {
    const c = unescapeMd(content);
    const m = c.match(/\[REPLY:日常クーちゃん:([^\]]+)\]\n?([\s\S]*)$/);
    if (!m) return { main: c, reply: null, replyTime: null };
    const main = c.slice(0, m.index).replace(/-{2,}\s*$/, '').trim();
    return { main, reply: m[2].trim(), replyTime: m[1].trim() };
  }

  function extractSelfPostBody(content) {
    const c = unescapeMd(content)
      .replace(/^#\s*えびちゃんのつぶやき\s*$/m, '')
      .replace(/^記録者[:：].*$/m, '')
      .replace(/^投稿日時[:：].*$/m, '')
      .trim();
    return c.length > 280 ? c.slice(0, 280) + '…' : c;
  }

  // 読み込み待ちの間に遊べる、ちょっとした3マッチパズル（タップ操作＋フリック操作の両対応）
  function initMatch3(root, onInteract) {
    const SIZE = 6;
    const CELL = 40;
    const GAP = 4;
    const PAD = 6;
    const STEP = CELL + GAP;
    const BOARD = SIZE * CELL + (SIZE - 1) * GAP + PAD * 2;
    const TYPES = ['🍓', '🍋', '🍇', '🍊', '🫐', '🍒'];
    const FLICK_THRESHOLD = 16;

    const gridEl = root.querySelector('.tl-puzzle-grid');
    if (!gridEl) return;
    gridEl.style.width = BOARD + 'px';
    gridEl.style.height = BOARD + 'px';

    let grid = [];
    let score = 0;
    let selected = null;
    let busy = false;
    let hintTimer = null;
    let hintCells = null;
    let dragState = null;

    function wait(ms) { return new Promise(res => setTimeout(res, ms)); }
    function randType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }
    function posFor(r, c) { return { left: PAD + c * STEP, top: PAD + r * STEP }; }
    function cellKey(r, c) { return r + ',' + c; }

    function createTileEl(type, r, c) {
      const el = document.createElement('div');
      el.className = 'tl-puzzle-cell';
      el.textContent = type;
      el.dataset.r = r;
      el.dataset.c = c;
      gridEl.appendChild(el);
      return el;
    }

    function setTilePos(tile, r, c, opts) {
      tile.el.dataset.r = r;
      tile.el.dataset.c = c;
      const { left, top } = posFor(r, c);
      tile.el.style.left = left + 'px';
      if (opts && opts.fromAbove != null) {
        tile.el.style.top = (top - opts.fromAbove * STEP) + 'px';
        tile.el.style.opacity = '0';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (!root.isConnected) return;
            tile.el.style.top = top + 'px';
            tile.el.style.opacity = '1';
          });
        });
      } else {
        tile.el.style.top = top + 'px';
      }
    }

    function applySpecialVisual(tile, kind) {
      tile.special = kind;
      tile.el.classList.add('tl-puzzle-special-' + kind);
      const badge = document.createElement('span');
      badge.className = 'tl-puzzle-badge';
      badge.textContent = kind === 'lineH' ? '↔️' : kind === 'lineV' ? '↕️' : kind === 'wrapped' ? '💥' : kind === 'flyer' ? '🚁' : '🌈';
      tile.el.appendChild(badge);
      if (kind === 'colorbomb') tile.type = null;
    }

    function initGrid() {
      grid = [];
      for (let r = 0; r < SIZE; r++) {
        const row = [];
        for (let c = 0; c < SIZE; c++) {
          let type;
          do {
            type = randType();
          } while (
            (c >= 2 && row[c - 1].type === type && row[c - 2].type === type) ||
            (r >= 2 && grid[r - 1][c].type === type && grid[r - 2][c].type === type)
          );
          const el = createTileEl(type, r, c);
          const tile = { type, special: null, el };
          setTilePos(tile, r, c);
          row.push(tile);
        }
        grid.push(row);
      }
    }

    function findMatches() {
      const matched = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
      for (let r = 0; r < SIZE; r++) {
        let runStart = 0;
        for (let c = 1; c <= SIZE; c++) {
          const cur = c < SIZE ? grid[r][c] : null;
          const start = grid[r][runStart];
          if (cur && start && cur.type != null && cur.type === start.type) continue;
          if (c - runStart >= 3 && start && start.type != null) for (let k = runStart; k < c; k++) matched[r][k] = true;
          runStart = c;
        }
      }
      for (let c = 0; c < SIZE; c++) {
        let runStart = 0;
        for (let r = 1; r <= SIZE; r++) {
          const cur = r < SIZE ? grid[r][c] : null;
          const start = grid[runStart][c];
          if (cur && start && cur.type != null && cur.type === start.type) continue;
          if (r - runStart >= 3 && start && start.type != null) for (let k = runStart; k < r; k++) matched[k][c] = true;
          runStart = r;
        }
      }
      return matched;
    }

    function findSquares() {
      const squares = [];
      const claimed = new Set();
      for (let r = 0; r < SIZE - 1; r++) {
        for (let c = 0; c < SIZE - 1; c++) {
          const a = grid[r][c], b = grid[r][c + 1], cc = grid[r + 1][c], d = grid[r + 1][c + 1];
          if (a && b && cc && d && a.type != null && a.type === b.type && a.type === cc.type && a.type === d.type) {
            const cells = [{ r, c }, { r, c: c + 1 }, { r: r + 1, c }, { r: r + 1, c: c + 1 }];
            if (cells.every(cell => !claimed.has(cellKey(cell.r, cell.c)))) {
              cells.forEach(cell => claimed.add(cellKey(cell.r, cell.c)));
              squares.push({ cells, type: a.type });
            }
          }
        }
      }
      return squares;
    }

    function findMatchGroups() {
      const matchedMask = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
      for (let r = 0; r < SIZE; r++) {
        let runStart = 0;
        for (let c = 1; c <= SIZE; c++) {
          const cur = c < SIZE ? grid[r][c] : null;
          const start = grid[r][runStart];
          if (cur && start && cur.type != null && cur.type === start.type) continue;
          if (c - runStart >= 3 && start && start.type != null) for (let k = runStart; k < c; k++) matchedMask[r][k] = true;
          runStart = c;
        }
      }
      for (let c = 0; c < SIZE; c++) {
        let runStart = 0;
        for (let r = 1; r <= SIZE; r++) {
          const cur = r < SIZE ? grid[r][c] : null;
          const start = grid[runStart][c];
          if (cur && start && cur.type != null && cur.type === start.type) continue;
          if (r - runStart >= 3 && start && start.type != null) for (let k = runStart; k < r; k++) matchedMask[k][c] = true;
          runStart = r;
        }
      }
      const visited = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
      const groups = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (matchedMask[r][c] && !visited[r][c] && grid[r][c]) {
            const type = grid[r][c].type;
            const stack = [{ r, c }];
            const cells = [];
            visited[r][c] = true;
            while (stack.length) {
              const cur = stack.pop();
              cells.push(cur);
              const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
              for (const [dr, dc] of dirs) {
                const nr = cur.r + dr, nc = cur.c + dc;
                if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && matchedMask[nr][nc] && !visited[nr][nc] && grid[nr][nc] && grid[nr][nc].type === type) {
                  visited[nr][nc] = true;
                  stack.push({ r: nr, c: nc });
                }
              }
            }
            const rs = cells.map(x => x.r), cs = cells.map(x => x.c);
            const minR = Math.min(...rs), maxR = Math.max(...rs), minC = Math.min(...cs), maxC = Math.max(...cs);
            const W = maxC - minC + 1, H = maxR - minR + 1, n = cells.length;
            let shape = 'line3';
            if (n >= 5 && (H === 1 || W === 1)) shape = 'line5plus';
            else if (n === 4 && H === 1 && W === 4) shape = 'line4h';
            else if (n === 4 && W === 1 && H === 4) shape = 'line4v';
            else if (n >= 5) shape = 'lshape';
            groups.push({ cells, type, shape });
          }
        }
      }
      return groups;
    }

    function shapeToKind(shape) {
      if (shape === 'line4h') return 'lineV';
      if (shape === 'line4v') return 'lineH';
      if (shape === 'line5plus') return 'colorbomb';
      if (shape === 'lshape') return 'wrapped';
      return null;
    }

    function collectSpecialEffectCells(tile, r, c) {
      if (!tile || !tile.special) return [];
      const kind = tile.special;
      const cells = [];
      if (kind === 'lineV') {
        for (let rr = 0; rr < SIZE; rr++) if (rr !== r) cells.push({ r: rr, c });
      } else if (kind === 'lineH') {
        for (let cc = 0; cc < SIZE; cc++) if (cc !== c) cells.push({ r, c: cc });
      } else if (kind === 'wrapped') {
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && !(dr === 0 && dc === 0)) cells.push({ r: rr, c: cc });
        }
      } else if (kind === 'flyer') {
        const candidates = [];
        for (let rr = 0; rr < SIZE; rr++) for (let cc = 0; cc < SIZE; cc++) {
          if (!(rr === r && cc === c) && grid[rr][cc]) candidates.push({ r: rr, c: cc });
        }
        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        cells.push(...candidates.slice(0, 3));
      }
      return cells;
    }

    function updateScore() {
      const scoreEl = root.querySelector('.tl-puzzle-score');
      if (scoreEl) scoreEl.textContent = `スコア: ${score}`;
    }

    function explodeAndClear(cells) {
      if (!cells.length) return Promise.resolve();
      return new Promise(resolve => {
        cells.forEach(({ r, c }) => {
          const tile = grid[r][c];
          if (tile) tile.el.classList.add('tl-puzzle-pop');
        });
        gridEl.classList.add('tl-puzzle-shake');
        setTimeout(() => {
          if (!root.isConnected) { resolve(); return; }
          gridEl.classList.remove('tl-puzzle-shake');
          cells.forEach(({ r, c }) => {
            const tile = grid[r][c];
            if (tile) { tile.el.remove(); grid[r][c] = null; }
          });
          resolve();
        }, 260);
      });
    }

    function applyGravityAnimated() {
      for (let c = 0; c < SIZE; c++) {
        let write = SIZE - 1;
        for (let r = SIZE - 1; r >= 0; r--) {
          if (grid[r][c]) {
            if (write !== r) {
              const tile = grid[r][c];
              grid[write][c] = tile;
              grid[r][c] = null;
              setTilePos(tile, write, c);
            }
            write--;
          }
        }
        const newCount = write + 1;
        for (let r = write; r >= 0; r--) {
          const type = randType();
          const el = createTileEl(type, r, c);
          const tile = { type, special: null, el };
          grid[r][c] = tile;
          setTilePos(tile, r, c, { fromAbove: newCount - r });
        }
      }
    }

    function flyHelicopter(fromR, fromC, toR, toC) {
      return new Promise(resolve => {
        if (!root.isConnected) { resolve(); return; }
        const startPos = posFor(fromR, fromC);
        const endPos = posFor(toR, toC);
        const heli = document.createElement('div');
        heli.className = 'tl-puzzle-heli';
        heli.textContent = '🚁';
        heli.style.left = startPos.left + 'px';
        heli.style.top = startPos.top + 'px';
        gridEl.appendChild(heli);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (!root.isConnected) { heli.remove(); resolve(); return; }
            heli.style.left = endPos.left + 'px';
            heli.style.top = endPos.top + 'px';
          });
        });
        setTimeout(() => {
          heli.remove();
          resolve();
        }, 280);
      });
    }

    async function resolveSquares(squares) {
      const clearCells = [];
      const specialsToCreate = [];
      squares.forEach(sq => {
        const keep = sq.cells[0];
        specialsToCreate.push({ r: keep.r, c: keep.c, kind: 'flyer' });
        sq.cells.slice(1).forEach(cell => clearCells.push(cell));
      });
      score += clearCells.length * 10;
      updateScore();
      await explodeAndClear(clearCells);
      if (!root.isConnected) return;
      specialsToCreate.forEach(({ r, c, kind }) => {
        const tile = grid[r][c];
        if (tile) applySpecialVisual(tile, kind);
      });
      applyGravityAnimated();
      await wait(320);
    }

    async function resolveGroups(groups) {
      const clearMap = new Map();
      const specialsToCreate = [];
      groups.forEach(g => {
        const kind = shapeToKind(g.shape);
        const keepIdx = Math.floor(g.cells.length / 2);
        g.cells.forEach((cell, idx) => {
          const key = cellKey(cell.r, cell.c);
          if (kind && idx === keepIdx) {
            specialsToCreate.push({ r: cell.r, c: cell.c, kind });
          } else if (!clearMap.has(key)) {
            clearMap.set(key, cell);
          }
        });
      });
      const queue = Array.from(clearMap.values());
      const processed = new Set();
      while (queue.length) {
        const { r, c } = queue.pop();
        const key = cellKey(r, c);
        if (processed.has(key)) continue;
        processed.add(key);
        const tile = grid[r][c];
        if (tile && tile.special) {
          collectSpecialEffectCells(tile, r, c).forEach(cell => {
            const k = cellKey(cell.r, cell.c);
            if (!clearMap.has(k)) { clearMap.set(k, cell); queue.push(cell); }
          });
        }
      }
      const finalSpecials = specialsToCreate.filter(s => !clearMap.has(cellKey(s.r, s.c)));
      score += clearMap.size * 10;
      updateScore();
      await explodeAndClear(Array.from(clearMap.values()));
      if (!root.isConnected) return;
      finalSpecials.forEach(({ r, c, kind }) => {
        const tile = grid[r][c];
        if (tile) applySpecialVisual(tile, kind);
      });
      applyGravityAnimated();
      await wait(320);
    }

    async function processBoardUntilStable() {
      while (root.isConnected) {
        const squares = findSquares();
        if (squares.length) { await resolveSquares(squares); continue; }
        const groups = findMatchGroups();
        if (groups.length) { await resolveGroups(groups); continue; }
        break;
      }
    }

    function isAdjacent(a, b) { return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1; }

    function swapTiles(a, b) {
      const ta = grid[a.r][a.c];
      const tb = grid[b.r][b.c];
      grid[a.r][a.c] = tb;
      grid[b.r][b.c] = ta;
      setTilePos(tb, a.r, a.c);
      setTilePos(ta, b.r, b.c);
    }

    function highlightSelected() {
      gridEl.querySelectorAll('.tl-puzzle-cell.tl-puzzle-selected').forEach(el => el.classList.remove('tl-puzzle-selected'));
      if (selected) {
        const tile = grid[selected.r][selected.c];
        if (tile) tile.el.classList.add('tl-puzzle-selected');
      }
    }

    function wouldMatch(r1, c1, r2, c2) {
      const a = grid[r1][c1], b = grid[r2][c2];
      if (!a || !b) return false;
      grid[r1][c1] = b; grid[r2][c2] = a;
      const has = findMatches().some(row => row.some(v => v));
      grid[r1][c1] = a; grid[r2][c2] = b;
      return has;
    }

    function findHintMove() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (c + 1 < SIZE && wouldMatch(r, c, r, c + 1)) return { a: { r, c }, b: { r, c: c + 1 } };
          if (r + 1 < SIZE && wouldMatch(r, c, r + 1, c)) return { a: { r, c }, b: { r: r + 1, c } };
        }
      }
      return null;
    }

    function clearHint() {
      if (hintCells) {
        [hintCells.a, hintCells.b].forEach(pos => {
          const tile = grid[pos.r] && grid[pos.r][pos.c];
          if (tile) tile.el.classList.remove('tl-puzzle-hint-pulse');
        });
        hintCells = null;
      }
    }

    function showHint() {
      if (!root.isConnected) return;
      if (busy) { hintTimer = setTimeout(showHint, 1000); return; }
      const move = findHintMove();
      if (!move) return;
      hintCells = move;
      const ta = grid[move.a.r][move.a.c];
      const tb = grid[move.b.r][move.b.c];
      if (ta) ta.el.classList.add('tl-puzzle-hint-pulse');
      if (tb) tb.el.classList.add('tl-puzzle-hint-pulse');
    }

    function resetHintTimer() {
      clearHint();
      if (hintTimer) clearTimeout(hintTimer);
      if (!root.isConnected) return;
      hintTimer = setTimeout(showHint, 3000);
    }

    async function activateColorBomb(bombPos, otherTile) {
      const targetType = otherTile.type;
      const cells = [];
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (t && (t.type === targetType || (r === bombPos.r && c === bombPos.c))) cells.push({ r, c });
      }
      score += cells.length * 10;
      updateScore();
      await explodeAndClear(cells);
      if (!root.isConnected) return;
      applyGravityAnimated();
      await wait(320);
      await processBoardUntilStable();
    }

    async function activateGenericSpecial(a, b, tileAWasSpecial, tileBWasSpecial) {
      const clearMap = new Map();
      const queue = [];
      if (tileAWasSpecial) { clearMap.set(cellKey(b.r, b.c), { r: b.r, c: b.c }); queue.push({ r: b.r, c: b.c }); }
      if (tileBWasSpecial) { clearMap.set(cellKey(a.r, a.c), { r: a.r, c: a.c }); queue.push({ r: a.r, c: a.c }); }

      for (const pos of [...queue]) {
        const t = grid[pos.r][pos.c];
        if (t && t.special === 'flyer') {
          const targets = collectSpecialEffectCells(t, pos.r, pos.c);
          for (const tgt of targets) {
            await flyHelicopter(pos.r, pos.c, tgt.r, tgt.c);
            const key = cellKey(tgt.r, tgt.c);
            if (!clearMap.has(key)) clearMap.set(key, tgt);
          }
        }
      }

      const processed = new Set();
      const queue2 = Array.from(clearMap.values());
      while (queue2.length) {
        const { r, c } = queue2.pop();
        const key = cellKey(r, c);
        if (processed.has(key)) continue;
        processed.add(key);
        const tile = grid[r][c];
        if (tile && tile.special && tile.special !== 'flyer') {
          collectSpecialEffectCells(tile, r, c).forEach(cell => {
            const k = cellKey(cell.r, cell.c);
            if (!clearMap.has(k)) { clearMap.set(k, cell); queue2.push(cell); }
          });
        }
      }

      score += clearMap.size * 10;
      updateScore();
      await explodeAndClear(Array.from(clearMap.values()));
      if (!root.isConnected) return;
      applyGravityAnimated();
      await wait(320);
      await processBoardUntilStable();
    }

    // 2つのマス(a,b)の入れ替えを試みる（マッチ成立すれば確定、しなければ元に戻す）。
    // タップ操作・フリック操作どちらからも共通で呼ばれる。
    async function attemptSwap(a, b) {
      if (busy || !root.isConnected) return;
      selected = null;
      highlightSelected();
      resetHintTimer();

      const tileA = grid[a.r] && grid[a.r][a.c];
      const tileB = grid[b.r] && grid[b.r][b.c];
      if (!tileA || !tileB) return;

      busy = true;

      if (tileA.special === 'colorbomb' || tileB.special === 'colorbomb') {
        const bombIsA = tileA.special === 'colorbomb';
        const bombPos = bombIsA ? a : b;
        const otherTile = bombIsA ? tileB : tileA;
        await activateColorBomb(bombPos, otherTile);
        busy = false;
        resetHintTimer();
        return;
      }

      if (tileA.special || tileB.special) {
        swapTiles(a, b);
        await wait(220);
        if (!root.isConnected) return;
        await activateGenericSpecial(a, b, !!tileA.special, !!tileB.special);
        busy = false;
        resetHintTimer();
        return;
      }

      swapTiles(a, b);
      await wait(220);
      if (!root.isConnected) return;
      const hasMatch = findMatches().some(row => row.some(v => v)) || findSquares().length > 0;
      if (hasMatch) {
        await processBoardUntilStable();
      } else {
        swapTiles(a, b);
        await wait(220);
      }
      busy = false;
      resetHintTimer();
    }

    // 通常のタップ操作（1つ目をタップして選択→隣を2つ目にタップして入れ替え）
    function handleTap(pos) {
      if (busy || !root.isConnected) return;
      resetHintTimer();
      if (!selected) { selected = pos; highlightSelected(); return; }
      if (selected.r === pos.r && selected.c === pos.c) { selected = null; highlightSelected(); return; }
      if (!isAdjacent(selected, pos)) { selected = pos; highlightSelected(); return; }
      const a = selected, b = pos;
      attemptSwap(a, b);
    }

    // フリック（スワイプ）操作：マスを指で押したまま上下左右にずらすと、その方向のマスと即座に入れ替わる
    function handlePointerDown(ev) {
      if (typeof onInteract === 'function') onInteract();
      if (busy || !root.isConnected) return;
      const cellEl = ev.target.closest('.tl-puzzle-cell');
      if (!cellEl) return;
      const pos = { r: Number(cellEl.dataset.r), c: Number(cellEl.dataset.c) };
      dragState = { start: pos, x: ev.clientX, y: ev.clientY, moved: false, pointerId: ev.pointerId };
      try { gridEl.setPointerCapture(ev.pointerId); } catch (e) {}
    }

    function handlePointerMove(ev) {
      if (!dragState || dragState.moved || dragState.pointerId !== ev.pointerId) return;
      const dx = ev.clientX - dragState.x;
      const dy = ev.clientY - dragState.y;
      if (Math.abs(dx) < FLICK_THRESHOLD && Math.abs(dy) < FLICK_THRESHOLD) return;
      dragState.moved = true;
      let dr = 0, dc = 0;
      if (Math.abs(dx) > Math.abs(dy)) { dc = dx > 0 ? 1 : -1; } else { dr = dy > 0 ? 1 : -1; }
      const target = { r: dragState.start.r + dr, c: dragState.start.c + dc };
      const from = dragState.start;
      dragState = null;
      if (target.r < 0 || target.r >= SIZE || target.c < 0 || target.c >= SIZE) return;
      selected = null;
      highlightSelected();
      attemptSwap(from, target);
    }

    function handlePointerUp(ev) {
      if (!dragState || dragState.pointerId !== ev.pointerId) return;
      const wasMoved = dragState.moved;
      const pos = dragState.start;
      dragState = null;
      if (!wasMoved) handleTap(pos);
    }

    function handlePointerCancel(ev) {
      if (dragState && dragState.pointerId === ev.pointerId) dragState = null;
    }

    initGrid();
    gridEl.addEventListener('pointerdown', handlePointerDown);
    gridEl.addEventListener('pointermove', handlePointerMove);
    gridEl.addEventListener('pointerup', handlePointerUp);
    gridEl.addEventListener('pointercancel', handlePointerCancel);
    updateScore();
    resetHintTimer();
  }

  // データの読み込みが終わっても、パズルで遊んでいる間はタイムラインに切り替えない。

  function saveToken(token, expiresIn) {
    const expiry = Date.now() + (expiresIn * 1000) - 60000;
    localStorage.setItem(TOKEN_STORAGE_KEY, JSON.stringify({ token, expiry }));
  }
  function loadSavedToken() {
    try {
      const raw = localStorage.getItem(TOKEN_STORAGE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (data.expiry && data.expiry > Date.now()) return data.token;
    } catch (e) {}
    return null;

  // ---- Google Drive API ----
  async function driveFetch(url) {
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
    if (res.status === 401) {
      localStorage.removeItem(TOKEN_STORAGE_KEY);
      document.getElementById('tl-app').style.display = 'none';
      document.getElementById('tl-auth').style.display = 'block';
      document.getElementById('tl-auth-status').textContent = 'ログインの有効期限が切れちゃった、もう一度ログインしてね';
      throw new Error('unauthorized');
    }
    if (!res.ok) throw new Error('drive api error: ' + res.status);
    return res;
  }

  // Inbox直下のサブフォルダ一覧（日付フォルダを探すため）
  async function driveListFolders(parentId) {
    const q = `'${parentId}' in parents and trashed = false and mimeType = '${FOLDER_MIME}'`;
    const url = 'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) +
      '&fields=' + encodeURIComponent('files(id,name)') +
      '&pageSize=100&orderBy=name desc';
    const res = await driveFetch(url);
    const data = await res.json();
    return data.files || [];
  }

  async function driveList(folderId, cutoffIso) {
    const q = `'${folderId}' in parents and modifiedTime > '${cutoffIso}' and trashed = false and mimeType != 'application/vnd.google-apps.folder'`;
    const url = 'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) +
      '&fields=' + encodeURIComponent('files(id,name,mimeType,modifiedTime,createdTime,webViewLink)') +
      '&pageSize=50&orderBy=modifiedTime desc';
    const res = await driveFetch(url);
    const data = await res.json();
    return data.files || [];
  }

  async function driveGetContent(fileId) {
    try {
      const res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
      return await res.text();
    } catch (e) { return ''; }
  }

  async function driveCreateFile(name, content, parentId) {
    const boundary = 'claudder_' + Date.now();
    const metadata = { name, parents: [parentId], mimeType: 'text/plain' };
    const body =
      '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: text/plain; charset=UTF-8\r\n\r\n' +
      content + '\r\n' +
      '--' + boundary + '--';
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'multipart/related; boundary=' + boundary },
      body
    });
    if (!res.ok) throw new Error('create failed: ' + res.status);
    return await res.json();
  }

  // その日の日付フォルダ（Inbox/YYYY-MM-DD/）を探し、無ければ作ってIDを返す
  async function ensureDateFolder(dateStr) {
    const q = `'${INBOX_FOLDER_ID}' in parents and trashed = false and mimeType = '${FOLDER_MIME}' and name = '${dateStr}'`;
    const url = 'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) +
      '&fields=' + encodeURIComponent('files(id,name)') + '&pageSize=5';
    const res = await driveFetch(url);
    const data = await res.json();
    if (data.files && data.files.length) return data.files[0].id;

    const made = await fetch('https://www.googleapis.com/drive/v3/files?fields=id', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: dateStr, mimeType: FOLDER_MIME, parents: [INBOX_FOLDER_ID] })
    });
    if (!made.ok) throw new Error('日付フォルダを作れなかったよ');
    return (await made.json()).id;
  }

  async function loadAll() {
    showLoading();

    const cutoffIso = new Date(Date.now() - LOOKBACK_DAYS * 24 * 60 * 60 * 1000).toISOString();

    let files = [];
    let errors = [];

    // --- ① Inbox直下の日付フォルダ（YYYY-MM-DD）一覧を取得する ---
    const cutoffDateStr = new Date(Date.now() - LOOKBACK_DAYS * 24 * 60 * 60 * 1000)
      .toISOString().slice(0, 10);

    let dateFolders = [];
    try {
      const subFolders = await driveListFolders(INBOX_FOLDER_ID);
      dateFolders = subFolders
        .filter(f => /^\d{4}-\d{2}-\d{2}$/.test((f.name || '').trim()))
        .map(f => ({ id: f.id, name: (f.name || '').trim() }))
        .filter(f => f.name >= cutoffDateStr)   // 文字列比較でそのまま日付の新旧が判定できる
        .sort((a, b) => b.name.localeCompare(a.name));
    } catch (e) {
      if (e.message === 'unauthorized') return;
      errors.push('日付フォルダ一覧: ' + e.message);
    }

    // --- ② 読みに行く対象のフォルダを組み立てる ---
    // 【2026-08-12〜】えびちゃん本人の投稿(_TEMPURA.md)も日付フォルダに統合されたため、
    // 読みに行く先は「日付フォルダ」だけでよくなった。
    const targets = [
      ...dateFolders.map(f => ({ id: f.id, origin: 'Inbox', label: f.name })),
      // 移行前の名残でInbox直下に残っているファイルも一応拾う
      { id: INBOX_FOLDER_ID, origin: 'Inbox', label: 'Inbox' }
    ];

    const seenIds = new Set();
    for (const f of targets) {
      try {
        const folderFiles = await driveList(f.id, cutoffIso);
        folderFiles.forEach(file => {
          if (seenIds.has(file.id)) return;
          seenIds.add(file.id);
          files.push(Object.assign({}, file, { origin: f.origin }));
        });
      } catch (e) {
        if (e.message === 'unauthorized') return;
        errors.push(f.label + ': ' + e.message);
      }
    }

    if (files.length === 0) {
      pendingFeedHtml = errors.length
        ? '<div class="tl-error">読み込みエラー<br>' + errors.map(escapeHtml).join('<br>') + '</div>'
        : '<div class="tl-empty">まだ投稿がないみたい🐣</div>';
      puzzleDataReady = true;
      checkPuzzleGate();
      return;
    }

    const withContent = await Promise.all(files.map(async file => {
      const content = await driveGetContent(file.id);
      return Object.assign({}, file, { content });
    }));

    // 返信専用ファイルは投稿としては並べず、返信先の投稿にぶら下げる
    const replyMap = {};
    const postItems = [];
    withContent.forEach(f => {
      const r = parseReplyFile(f.name, f.content);
      if (r) {
        (replyMap[r.target] = replyMap[r.target] || []).push({
          who: 'tempura_self', time: r.time, body: r.body,
          sort: f.createdTime || f.modifiedTime || ''
        });
      } else {
        postItems.push(f);
      }
    });
    Object.keys(replyMap).forEach(k => replyMap[k].sort((a, b) => String(a.sort).localeCompare(String(b.sort))));

    const isSelfPost = f => personaKeyFromTitle(f.name) === 'tempura_self';

    allPosts = postItems.map(f => {
      const title = f.name;
      if (isSelfPost(f)) {
        const split = splitReply(f.content);
        return {
          id: f.id, title, origin: 'Claudder', viewUrl: f.webViewLink,
          modifiedTime: f.modifiedTime, createdTime: f.createdTime,
          persona: PERSONAS.tempura_self,
          summary: extractSelfPostBody(split.main),
          reply: split.reply, replyTime: split.replyTime,
          replies: replyMap[title] || []
        };
      }
      return {
        id: f.id, title, origin: f.origin, viewUrl: f.webViewLink,
        modifiedTime: f.modifiedTime, createdTime: f.createdTime,
        persona: detectPersona(title, f.content, f.origin),
        summary: extractPreparedSummary(f.content) || fallbackSummary(f.content),
        replies: replyMap[title] || []
      };
    });

    pendingFeedHtml = null;
    puzzleDataReady = true;
    checkPuzzleGate();
  }

  // ---- 投稿（コンポーズ） ----

  function openReplyBox(targetTitle) {
    document.querySelectorAll('.tl-replybox').forEach(el => el.remove());
    const slot = document.querySelector(`.tl-replybox-slot[data-slot="${CSS.escape(targetTitle)}"]`);
    if (!slot) return;
    const box = document.createElement('div');
    box.className = 'tl-replybox';
    box.innerHTML = `
      <div class="tl-replybox-avatar">${selfP.img ? `<img src="${selfP.img}" alt="">` : selfP.avatar}</div>
      <div class="tl-replybox-body">
        <textarea class="tl-replybox-input" rows="2" placeholder="返信を書く…"></textarea>
        <div class="tl-replybox-actions">
          <span class="tl-replybox-status"></span>
          <button class="tl-replybox-cancel">やめる</button>
          <button class="tl-replybox-send">返信する</button>
        </div>
      </div>`;
    slot.appendChild(box);
    box.querySelector('.tl-replybox-input').focus();
    box.querySelector('.tl-replybox-cancel').addEventListener('click', () => box.remove());
    box.querySelector('.tl-replybox-send').addEventListener('click', () => submitReply(targetTitle, box));
  }

  async function submitReply(targetTitle, box) {
    const input = box.querySelector('.tl-replybox-input');
    const sendBtn = box.querySelector('.tl-replybox-send');
    const status = box.querySelector('.tl-replybox-status');
    const text = (input.value || '').trim();
    if (!text) return;

    sendBtn.disabled = true;
    input.disabled = true;
    status.textContent = '返信中…';

    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const dateStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    const stamp = `${dateStr}-${pad(now.getHours())}-${pad(now.getMinutes())}`;
    const displayTime = `${dateStr} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const title = `${stamp}_TEMPURA-reply.md`;

    const content = `# えびちゃんからの返信

記録者：えびちゃん（本人・Claudder Webより返信）
返信先：${targetTitle}
投稿日時：${displayTime}

${encodeEmojiForStorage(text)}
`;

    try {
      const folderId = await ensureDateFolder(dateStr);
      await driveCreateFile(title, content, folderId);
      const post = allPosts.find(x => x.title === targetTitle);
      if (post) {
        post.replies = post.replies || [];
        post.replies.push({ who: 'tempura_self', time: displayTime, body: text, sort: now.toISOString() });
      }
      box.remove();
      render();
    } catch (e) {
      status.textContent = '返信できなかった…もう一度試してみてね';
      sendBtn.disabled = false;
      input.disabled = false;
    }
  }

  document.addEventListener('click', function (ev) {
    const btn = ev.target.closest('.tl-reply-btn');
    if (!btn) return;
    openReplyBox(btn.dataset.replyTo);
  });

  composeBtn.addEventListener('click', submitCompose);
  composeInput.addEventListener('keydown', (ev) => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') submitCompose();
  });
})();
</script>
</body>
